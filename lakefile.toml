defaultTargets = ["MIL", "Course", "PiNoIntegral", "pi_no_integral"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "MIL"

[[lean_lib]]
name = "Course"

[[lean_lib]]
name = "PiNoIntegral"

[[lean_exe]]
name = "pi_no_integral"
root = "Main"
